[project]
name = "sy09-projet"
version = "0.1.0"
description = "Projet SY09 — analyse des performances scolaires"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
    "numpy",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "prince",
    "statsmodels",
    "scikit-posthocs",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.0", "jupyter>=1.0", "ipython>=8.0"]

[tool.uv]
package = false
