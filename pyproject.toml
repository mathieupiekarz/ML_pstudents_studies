[project]
name = "sy09-projet"
version = "0.1.0"
description = "Projet SY09 — analyse des performances scolaires"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
    "numpy",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "prince",
    "statsmodels",
    "scikit-posthocs",
]

[dependency-groups]
notebook = [
    "ipywidgets>=8.0",
    "jupyter>=1.0",
    "ipython>=8.0",
    "nbconvert[webpdf]>=7.0",
    "pypandoc-binary>=1.17",
    "plotly>=6.0",
]

[tool.uv]
package = false
default-groups = ["notebook"]
